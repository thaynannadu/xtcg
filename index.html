<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Líder de Ginásio · XTCG Card Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-texto">
      <img class="hero-logo" src="assets/logo.png" alt="XTCG Card Shop">
      <h1 id="titulo">Líder de Ginásio</h1>
      <p id="subtitulo" class="sub"></p>
    </div>
  </header>

  <main>
    <div class="barra">
      <label class="seletor">
        <span class="sr">Mês</span>
        <select id="mes"></select>
      </label>
      <button id="baixar" class="btn btn-grad" type="button">Baixar imagem</button>
    </div>

    <div id="avisos" class="avisos" hidden></div>

    <ol id="podio" class="podio" aria-label="Top 3"></ol>

    <div class="rolagem" id="resto">
      <table id="tabela">
        <thead>
          <tr>
            <th scope="col">Posição</th>
            <th scope="col" class="esq">Nome</th>
            <th scope="col">Pontos de desempenho</th>
            <th scope="col">Pontos de participação</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <p id="vazio" class="vazio" hidden>Nenhum semanal neste mês. Adicione um em <code>docs/data/eventos.json</code>.</p>

    <section class="semanais">
      <h2>Semanais contabilizados</h2>
      <ul id="lista-semanais" class="chips"></ul>
      <p class="regra">Desempenho = jogadores − colocação + 1. Participação = 1 ponto por semanal. Desempate pela participação.</p>
    </section>
  </main>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
